name: Convert uploaded Excel to dashboard data

# Pages ใช้แบบ "Deploy from a branch" (main / root) — workflow นี้แค่แปลงไฟล์ Excel เป็น data/*.json
# แล้ว commit กลับ ซึ่งจะทำให้ GitHub Pages build ใหม่อัตโนมัติ
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-data
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install openpyxl

      - name: Convert uploaded Excel (ชื่อไฟล์/โฟลเดอร์อะไรก็ได้)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/auto_update.py "${{ github.event.before }}" "${{ github.sha }}"
          else
            python scripts/auto_update.py
          fi

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          git commit -m "Update dashboard data from uploaded file"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
